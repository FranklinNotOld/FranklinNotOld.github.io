### Introduction

**AlexNet** achieved a groundbreaking victory in the 2012 ImageNet competition, securing the top spot in Top-1 classification accuracy and surpassing the second-place entry by nearly 10 percentage points. Notably, the 2013 winning model, ZFNet, was an optimized version of AlexNet that yielded even better results. Unlike the early LeNet, which managed ten-class classification, AlexNet pushed the boundaries by handling a thousand classes, setting a new standard in performance.

Additionally, AlexNet highlighted the importance of neural network depth for model effectiveness and demonstrated the significant acceleration possible using GPUs. While AlexNet may not have reached the same level of fame and popularity as VGG (although it still holds substantial acclaim), its milestone achievements are arguably more impactful than VGG's. Despite VGG's superior performance, AlexNet laid the groundwork for future research with its pioneering concepts such as normalization, Dropout, ReLU activation, and the application of deep networks accelerated by GPUs.

### Structure

<img src="media/alexnet/1.png" alt="1" style="zoom:20%;" />

AlexNet consists of eight layers: the first five are convolutional layers, some of which include max-pooling layers, while the last three are fully connected layers. Except for the final layer, the network is split into two parts, each running on one GPU. The entire architecture can be represented as follows:

$$
(CNN→LRN→MP)^2→(CNN^3→MP)→(FC→DO)^2→Linear→Softmax
$$
Each acronym represents:

- CNN = Convolutional Layer (followed by the activation function ReLU)
- LRN = Local Response Normalization
- MP = Max Pooling
- FC = Fully Connected Layer (followed by the activation function ReLU)
- Linear = Fully Connected Layer (no activation)
- DO = Dropout

A more detailed diagram of the architecture is shown below:

![3](media/alexnet/3.png)

#### Local Response Normalization

<img src="media/alexnet/2.png" alt="2" style="zoom: 33%;" />

Local Response Normalization (LRN) is a normalization technique that focuses on parameters at the same spatial position across different channels. Mathematically, it is defined as:

$$
b^i_{x, y} = a^i_{x, y} / \left( k + \alpha \sum_{j = \max(0, i - \frac{n}{2})}^{\min(N - 1, i + \frac{n}{2})} (a^j_{x, y})^2 \right)^\beta
$$

Where $ a^i_{x, y} $ is the input parameter at position $ (x, y) $ on the $ i $th convolutional filter, and $ b^i_{x, y} $ is the output parameter at the same position. $ N $ is the total number of convolutional filters, and $ n $ is the normalization neighborhood size (since normalization may not be applied to all channels at once). The hyperparameters $ k, \alpha, \beta $ are set as 2, 0.0001, and 0.75 respectively in the original paper.

LRN is particularly useful for deep networks like AlexNet, which uses hundreds of channels. This form of normalization helps the model converge more effectively (similar to data normalization in preprocessing). From a neuroscience perspective, normalization can be seen as a form of lateral inhibition between groups of neurons.

#### ReLU

ReLU, or Rectified Linear Unit, is a piecewise linear function that is zero for inputs less than zero and equals the input for inputs greater than zero: $ \text{ReLU} = \max(0, x) $. Compared to Sigmoid, ReLU is easier to converge and its gradient is straightforward to compute (1 for inputs greater than zero). With Sigmoid, large inputs lead to outputs close to 1, causing the gradient to vanish; ReLU avoids this issue.

#### Dropout

Dropout is a technique where, during training (but not during prediction), a certain probability is used to randomly drop some neurons. This helps to reduce overfitting, although it may increase the number of epochs required for model convergence.



### Code

In the PyTorch framework, the `torchvision` library provides an easy way to call and implement models. The architecture is outlined as follows:

```python
AlexNet(
  (features): Sequential(
    (0): Conv2d(3, 64, kernel_size=(11, 11), stride=(4, 4), padding=(2, 2))
    (1): ReLU(inplace=True)
    (2): MaxPool2d(kernel_size=3, stride=2, padding=0, dilation=1, ceil_mode=False)
    (3): Conv2d(64, 192, kernel_size=(5, 5), stride=(1, 1), padding=(2, 2))
    (4): ReLU(inplace=True)
    (5): MaxPool2d(kernel_size=3, stride=2, padding=0, dilation=1, ceil_mode=False)
    (6): Conv2d(192, 384, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))
    (7): ReLU(inplace=True)
    (8): Conv2d(384, 256, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))
    (9): ReLU(inplace=True)
    (10): Conv2d(256, 256, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))
    (11): ReLU(inplace=True)
    (12): MaxPool2d(kernel_size=3, stride=2, padding=0, dilation=1, ceil_mode=False)
  )
  (avgpool): AdaptiveAvgPool2d(output_size=(6, 6))
  (classifier): Sequential(
    (0): Dropout(p=0.5, inplace=False)
    (1): Linear(in_features=9216, out_features=4096, bias=True)
    (2): ReLU(inplace=True)
    (3): Dropout(p=0.5, inplace=False)
    (4): Linear(in_features=4096, out_features=4096, bias=True)
    (5): ReLU(inplace=True)
    (6): Linear(in_features=4096, out_features=1000, bias=True)
  )
)
```

It's important to note that the AlexNet model in PyTorch's library is not the exact model proposed in the original paper; it has been fine-tuned and adjusted for better performance. If you want to encapsulate the model into a class and control the output dimensions, you can use the following code snippet:

```python
import torch.nn as nn
import torchvision.models as models
from torchvision.models.alexnet import AlexNet_Weights

class AlexNet(nn.Module):
    def __init__(self):
        super(AlexNet, self).__init__()
        self.alexnet = models.alexnet(weights=AlexNet_Weights.IMAGENET1K_V1)
        self.dim_feat = 1000
        self.alexnet.classifier[2] = nn.Linear(4096, 1000)

    def forward(self, x):
        output = self.alexnet(x)
        return output
```

### 引入

**AlexNet**在2012年以第一名在Top-1分类精度霸榜ImageNet，并超过第二名近10个百分点，并且值得说明的是，霸榜2013年的ZFNet也就是对AlexNet进行调参后得到了更好的结果。相比于古早的LeNet实现的十分类，AlexNet能够成功进行一千分类并且达到了一个新高度。此外，AlexNet证明了神经网络的深度对模型效果至关重要，并且可以利用GPU大大加速这一过程。AlexNet虽然相比于VGG的热度和知名度没有那么高（值得说明的是已经相当高了），但是个人认为其里程碑的意义要比VGG高。其效果虽然逊于VGG，但是无论是归一化的思想，还是Dropout、ReLU的应用，亦或是深层网络利用GPU加速，为后续各项研究提供了一个很好的研究基础。

### 模型结构

<img src="media/alexnet/1.png" alt="1" style="zoom:20%;" />

AlexNet 包含八层：前五层是卷积层，其中一些是最大池化层，后三层是全连接层。除最后一层外，网络被拆分为两个部分，每个部分在一个 GPU 上运行。整个结构可以写成：
$$
(CNN→LRN→MP)^2→(CNN^3→MP)→(FC→DO)^2→Linear→Softmax
$$
其中各个字母分别代表着：

- CNN = 卷积层（后面紧接着激活函数 ReLU）
- LRN = 局部响应归一化（Local Response Normalization）
- MP = 最大池化（Maxpooling）
- FC = 全连接层（后面紧接着激活函数 ReLU）
- 线性 = 全连接层（未激活）
- DO = 随机丢失（Dropout）

更为详细的结构图如下图所示：

![3](media/alexnet/3.png)

#### Local Response Normalization

<img src="media/alexnet/2.png" alt="2" style="zoom: 33%;" />

Local Response Normalization是一种归一化方式，主要针对的是卷积核不同通道上相同位置的参数。用数学公式表示就是：
$$
b^i_{x,y}=a^i_{x,y}/(k+\alpha\sum_{j=max(0,i-\frac{n}{2})}^{j=min(N-1,i+\frac{n}{2})}{a^j_{x,y}}^2)^\beta
$$
其中$a^i_{x,y}$是第$i$个卷积核上位置为$(x,y)$的输入参数，$b^i_{x,y}$是第$i$个卷积核上位置为$(x,y)$的输出参数，$N$是总卷积核的数量，$n$是归一化邻居数量（因为可能不是同时对所有卷积核/通道进行归一化），$\alpha,\beta,k$是超参数。在论文中，采用的是𝑘=2, 𝑛=5, 𝛼=0.0001, 𝛽=0.75的值。

这一操作对于像AlexNet这种深层次网络比较必要，因为AlexNet会使用上百个通道，使用这种归一化可以一定程度上帮助模型收敛（类似于数据预处理中的归一化的作用）。从神经科学角度上来看，归一化可以看成是神经元群体之前相互抑制作用。

#### ReLU

ReLU是由一个分段函数组成的，在自变量小于0的部分恒等于0，在自变量大于0的部分等于自变量，即$ReLU=max(0,x)$。相比于Sigmoid，ReLU更容易收敛，且由于梯度比较容易求（大于0的导数恒为1）。当因变量很大的时候，经过Sigmoid激活后基本都接近于1，导致梯度消失，而ReLU会避免这种情况。

#### Dropout

Dropout即在训练过程中（注意预测的时候不使用），按照特定概率随机丢失一定的神经元数据，这样可以有效降低过拟合，但是其代价是可能会导致模型收敛的epoch数更多。



### 实现代码

Pytorch框架中的torchvision库可以很方便的对其进行调用和实现。模型结构如下：

```python
AlexNet(
  (features): Sequential(
    (0): Conv2d(3, 64, kernel_size=(11, 11), stride=(4, 4), padding=(2, 2))
    (1): ReLU(inplace=True)
    (2): MaxPool2d(kernel_size=3, stride=2, padding=0, dilation=1, ceil_mode=False)
    (3): Conv2d(64, 192, kernel_size=(5, 5), stride=(1, 1), padding=(2, 2))
    (4): ReLU(inplace=True)
    (5): MaxPool2d(kernel_size=3, stride=2, padding=0, dilation=1, ceil_mode=False)
    (6): Conv2d(192, 384, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))
    (7): ReLU(inplace=True)
    (8): Conv2d(384, 256, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))
    (9): ReLU(inplace=True)
    (10): Conv2d(256, 256, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))
    (11): ReLU(inplace=True)
    (12): MaxPool2d(kernel_size=3, stride=2, padding=0, dilation=1, ceil_mode=False)
  )
  (avgpool): AdaptiveAvgPool2d(output_size=(6, 6))
  (classifier): Sequential(
    (0): Dropout(p=0.5, inplace=False)
    (1): Linear(in_features=9216, out_features=4096, bias=True)
    (2): ReLU(inplace=True)
    (3): Dropout(p=0.5, inplace=False)
    (4): Linear(in_features=4096, out_features=4096, bias=True)
    (5): ReLU(inplace=True)
    (6): Linear(in_features=4096, out_features=1000, bias=True)
  )
)
```

值得说明的是，现在Pytorch库中的AlexNet并不是原论文提出的模型，而是一种经过参数调整后效果更好一些的模型。如果要封装成一个类，并控制输出的维度，可以使用如下代码：

```python
import torch.nn as nn
import torchvision.models as models
from torchvision.models.alexnet import AlexNet_Weights

class AlexNet(nn.Module):
    def __init__(self):
        super(AlexNet, self).__init__()
        self.alexnet = models.alexnet(weights=AlexNet_Weights.IMAGENET1K_V1)
        self.dim_feat = 1000
        self.alexnet.classifier[2] = nn.Linear(4096, 1000)

    def forward(self, x):
        output = self.alexnet(x)
        return output
```
