<script type="text/markdown" data-lang="en">


BiNLL Loss stands for **Bivariate Gaussian Negative Log-Likelihood Loss**. In the blog post on the single variable Gaussian negative log-likelihood loss, we derived NLL Loss by taking the logarithm of a univariate normal distribution. Similarly, BiNLL Loss is derived by taking the logarithm of the bivariate normal distribution function.

The bivariate normal distribution function is as follows:
$$
f(x, y) = \frac{1}{2\pi \sigma_x \sigma_y \sqrt{1 - \rho^2}} \exp\left\{ -\frac{1}{2(1 - \rho^2)} \left[ \left(\frac{x - \mu_x}{\sigma_x}\right)^2 - 2 \rho \frac{x - \mu_x}{\sigma_x} \cdot \frac{y - \mu_y}{\sigma_y} + \left(\frac{y - \mu_y}{\sigma_y}\right)^2 \right] \right\}
$$

Where:
- $ \sigma_x $ and $ \sigma_y $ are the variances of $ x $ and $ y $, respectively.
- $ \mu_x $ and $ \mu_y $ are the means of $ x $ and $ y $, respectively.
- $ \rho $ is the correlation coefficient, given by:
    $$
    \rho = \frac{\text{Cov}(X, Y)}{\sigma_X \cdot \sigma_Y},
    $$
- $ \text{Cov}(X, Y) $ is the covariance between $ X $ and $ Y $, calculated as:
    $$
    \text{Cov}(X, Y) = E[(X - E[X])(Y - E[Y])].
    $$
- $ E[X] $ and $ E[Y] $ are the means (expectations) of $ X $ and $ Y $, respectively.
- $ E[(X - E[X])(Y - E[Y])] $ is the expected value of the product of the deviations of $ X $ and $ Y $ from their means.

Taking the logarithm of the bivariate normal distribution function yields BiNLL Loss:
$$
\log f(x, y) = -\log 2\pi - \log \sigma_x \sigma_y \sqrt{1 - \rho^2} - \frac{1}{2(1 - \rho^2)} \left[ \left(\frac{x - \mu_x}{\sigma_x}\right)^2 - 2 \rho \frac{x - \mu_x}{\sigma_x} \cdot \frac{y - \mu_y}{\sigma_y} + \left(\frac{y - \mu_y}{\sigma_y}\right)^2 \right]
$$

</script>
<script type="text/markdown" data-lang="cn">

BiNLL Loss是**Bivariate Gaussian Negative Log-Likelihood Loss**的缩写。在单变量高斯负对数似然损失函数那篇博客中，我们对一元正态分布取对数得到了NLL Loss，类似的，双变量高斯负对数似然损失函数可以由对二元正态分布函数取对数而得到。我们知道，二元正态分布函数如下：
$$
f(x,y)=\frac{1}{2\pi \sigma_x \sigma_y \sqrt{1-\rho^2}}exp\left\{-\frac{1}{2(1-\rho^2)}\left[\left(\frac{x-\mu_x}{\sigma_x}\right)^2-2\rho \frac{x-\mu_x}{\sigma_x}\frac{y-\mu_y}{\sigma_y}+\left(\frac{y-\mu_y}{\sigma_y}\right)^2 \right]\right \}
$$
其中$\sigma_x,\sigma_y$分别是$x,y$的方差，$\mu_x,\mu_y$分别是$x,y$的均值，$\rho$是相关系数，其表达式为：
$$
\rho = \frac{\text{Cov}(X, Y)}{\sigma_X \cdot \sigma_Y},
$$

其中：$ \text{Cov}(X, Y) $ 是 $ X $ 和 $ Y $​ 之间的协方差（covariance）。协方差的表达式为：
$$
\text{Cov}(X, Y) = E[(X - E[X])(Y - E[Y])],
$$

其中：

- $E[X]$ 和 $E[Y]$ 分别是随机变量 $X$ 和 $Y$ 的期望（均值）。
- $E[(X - E[X])(Y - E[Y])] $ 表示 $X$ 和 $Y$ 偏离各自期望的乘积的期望。

然后对二元正态分布函数取对数得到BiNLL Loss：
$$
logf(x,y)=-log2\pi-log\sigma_x\sigma_y\sqrt{1-\rho^2}-\frac{1}{2(1-\rho^2)}\left[\left(\frac{x-\mu_x}{\sigma_x}\right)^2-2\rho \frac{x-\mu_x}{\sigma_x}\frac{y-\mu_y}{\sigma_y}+\left(\frac{y-\mu_y}{\sigma_y}\right)^2 \right]
$$

</script>
