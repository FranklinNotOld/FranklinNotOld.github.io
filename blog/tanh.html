<script type="text/markdown" data-lang="en">

The hyperbolic tangent function (tanh) is closely related to the sigmoid function, serving as an amplified version of it. In practical usage, the tanh function is preferred over the sigmoid function.

### Function Expression

$$
\tanh(x) = \frac{e^x - e^{-x}}{e^x + e^{-x}}
$$

Defined over the entire real domain, its range is between $(-1, 1)$.

### Function Graph

![Tanh Function Graph](media/tanh/1.png)

### Function Characteristics

Since the tanh activation function is highly similar to the sigmoid activation function, they share many characteristics.

==In fact, the tanh activation function is essentially a translation of the sigmoid function: $\tanh(x) = 2\sigma(2x) - 1$==

#### Advantages:

- Symmetric about the origin, tanh converges faster than sigmoid, thereby improving the efficiency of weight updates.
  
- Partially mitigates the vanishing gradient problem due to its larger derivative values.

  > Comparison of tanh and sigmoid derivative values:
  >
  > ![Derivative Values Comparison](media/tanh/2.png)
  >
  > A comparison reveals that the derivative values of tanh are significantly larger than those of sigmoid.

#### Disadvantages:

- Like sigmoid, the tanh function suffers from saturation, failing to address the vanishing gradient problem.
- Higher computational complexity due to the involvement of exponential operations.

<script type="text/markdown" data-lang="cn">

双曲正切1函数(tanh)，其图像与sigmoid函数十分相近，相当于sigmoid函数的放大版。在实际的使用中，tanh函数要优先于sigmoid函数。

### 函数表达式

$$
tanh=\frac{e^x-e^{-x}}{e^x+e^{-x}}
$$

其定义域为$R$，值域为$(-1,1)$

### 函数图像

![QQ图片20221225172350](media/tanh/1.png)

### 函数特性

由于tanh激活函数与sigmoid激活函数十分相似，所以两者在特性方面有很多共同点

==实际上，tanh激活函数相当于sigmoid函数的平移：$tanh(x)=2sigmoid(2x)−2$==

#### 优点：

- 以0位对称中心，收敛速度快于sigmoid，提高了权重更新的效率

- 部分解决了梯度消失的问题，因为其导数值更大

   > tanh导数值与sigmoid导数值对比：
   >
   > ![QQ图片20221225175526](media/tanh/2.png)
   >
   > 通过对比不难发现，tanh的导数值要远远大于sigmoid的导数值

#### 缺点：

- 与sigmoid一样，tanh函数具有容易饱和的特点，没有根治梯度消失的问题
- 计算复杂度较高，幂运算更加复杂
