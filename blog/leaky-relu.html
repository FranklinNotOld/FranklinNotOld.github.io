<script type="text/markdown" data-lang="en">

The Leaky ReLU activation function was introduced to address the "dead ReLU" problem, where neurons die due to the gradient being zero for $x < 0$ in the ReLU function, preventing parameter updates. Leaky ReLU resolves this by replacing the $x < 0$ part with a small slope linear function.

### Function Expression

$$
f(x) = \max(\alpha x, x), \text{ where } \alpha << 1
$$

For $x < 0$, the function value is $f(x) = \alpha x$, such as $f(x) = 0.001x$; for $x > 0$, the function value is $f(x) = x$.

### Function Graph

![Leaky ReLU Graph](media/leaky-relu/1.png)

### Function Characteristics

While Leaky ReLU is an optimization over ReLU, its overall performance in experiments is comparable to or slightly worse than ReLU, particularly when ReLU is well-tuned. If the data is predominantly positive or normalized to (0, 1), Leaky ReLU may not offer significant advantages.

#### Advantages:

- Mitigates the dead ReLU problem to some extent, as the small slope $\alpha$ allows for gradient updates even for $x < 0$.

#### Disadvantages:

- Resembles a linear function, hence it might not perform well for complex classifications.

</script>
<script type="text/markdown" data-lang="cn">

Leaky ReLU激活函数是为了解决ReLU激活函数会出现的dead relu神经元死亡的现象，而这一现象的根本原因是ReLU函数在$x<0$的范围内梯度恒为0，无法更新参数。所以Leaky ReLU将$x<0$的部分换成一个斜率很小的一个线性函数来解决这一问题。

### 函数表达式

$$
f(x)=max\{\alpha x,x\},其中\alpha<<1
$$

当$x<0$时，函数值为$f(x)=\alpha x$，比如像$f(x)=0.001x$；当$x>0$时，函数值为$f(x)=x$

### 函数图像

![QQ图片20221224190237](media/leaky-relu/1.png)

### 函数特性

虽然其是ReLU的优化，但是实验中其整体效果不如ReLU（或者说不相上下，但是在ReLU调参合理的情况下，Leaky ReLU优势很弱）。如果数据处理后绝大部分为正数或者归一化到(0,1)，则无需使用Leaky ReLU。

#### 优点：

- 可以在一定程度上解决ReLU出现的dead ReLU问题，虽然斜率$\alpha$的值很小，但是依然存在梯度可以更新



#### 缺点：

- 由于该函数很像一个线性函数，所以其对复杂分类的效果不是很好
