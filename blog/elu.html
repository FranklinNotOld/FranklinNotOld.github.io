<script type="text/markdown" data-lang="en">

Exponential Linear Units (ELU) incorporate an exponential component into the activation function.

### Function Expression

$$
f(x) = 
\begin{cases} 
\alpha (e^x - 1), & \text{if } x \leq 0 \\
x, & \text{if } x > 0 
\end{cases}
$$

### Function Graph

![ELU Graph](media/elu/1.png)

The graph shows that for $x > 0$, the function behaves similarly to ReLU, while for $x < 0$, it resembles sigmoid or tanh.

### Function Characteristics

The ELU activation function is continuous and differentiable at all points ($\alpha = 1$), avoiding the issues of gradient vanishing and exploding. It combines the benefits of ReLU for $x > 0$ and sigmoid/tanh for $x < 0$. While theoretically superior to ReLU, empirical evidence does not consistently show ELU outperforming ReLU.

#### Advantages:

- Shorter training time and higher accuracy compared to ReLU, sigmoid, and tanh, due to continuity at the origin, which accelerates convergence.
- No dead ReLU problem.

#### Disadvantages:

- Slower computation due to non-linear operations, though this is partially offset by faster convergence.

</script>
<script type="text/markdown" data-lang="cn">

指数线性单元(ELU)，全称Exponential Linear Units，使用了指数作为激活函数的一部分。

### 函数表达式

$$
f(x)=\begin{cases}
\alpha (e^x-1),\quad x\leq 0\\
x, \quad x>0
\end{cases}
$$

### 函数图像

![QQ图片20221225153437](media/elu/1.png)

在图像上，$x>0$部分与ReLU相似，而在$x<0$部分与sigmoid/tanh相似

### 函数特性

ELU激活函数上所有点都是连续且可微的($\alpha =1$)，所以不存在梯度消失和梯度爆炸的问题。ELU在$x>0$部分与ReLU相似，而在$x<0$部分与sigmoid/tanh相似，这样就能很好的结合两者的优点。理论上，ELU要好于ReLU，但是实际上，并没有证据表明ELU总是优于ReLU。

#### 优点：

- 相比于ReLU、sigmoid、tanh激活函数，其训练时间更短、精确度也更高。因为其在原点处函数连续，这样能够加快函数收敛
- 没有dead relu神经元死亡问题

#### 缺点：

- 计算速度较慢，因为涉及到非线性的运算，但是其较快的收敛速度会对其进行一定程度上的弥补
