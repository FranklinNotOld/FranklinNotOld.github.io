<script type="text/markdown" data-lang="en">

Randomized Rectified Linear Unit (RReLU) is an extension of ReLU designed to address the dead ReLU problem by introducing a random factor.

### Function Expression

$$
f(x) = \begin{cases}
\alpha x, & \text{if } x \leq 0 \\
x, & \text{if } x > 0
\end{cases}
$$
where $\alpha$ is a random variable sampled from a uniform distribution $U(m, n)$.

For $x < 0$, the function is $f(x) = \alpha x$, with $\alpha$ being a random variable within the range $[m, n]$. For $x > 0$, the function is $f(x) = x$.

### Function Graph

![RReLU Graph](media/rrelu/1.png)

As shown in the graph, the left side of the function is chosen from the yellow region.

### Function Characteristics

#### Advantages:

- The introduction of randomness helps to reduce the risk of overfitting.

<script type="text/markdown" data-lang="cn">

随机修正整流线性单元(RReLU)，全称Randomized ReLU，是ReLU的延伸版，也是为了解决dead relu神经元坏死现象而提出的一种激活函数。

### 函数表达式

$$
f(x)=\begin{cases}
\alpha x,\quad x\leq 0\\
x, \quad x>0
\end{cases}
\\其中\alpha满足U(m,n)
$$

当$x<0$时，函数值为$f(x)=\alpha x$，但是$\alpha$初始是一个随机变量，随后不断进行修正，其取值范围为$[m,n]$；当$x>0$时，函数值为$f(x)=x$

如上图，左侧函数在黄色区域的范围内进行选择。

### 函数特性

#### 优点：

- 引入了随机因素，可以减少过拟合的风险
